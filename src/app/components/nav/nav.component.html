<div class="navbar">
  <button (click)="toggleMenu()" class="hamburger">{{ menuVisible ? 'X' : '&#9776;' }}</button>
  <div class="nav-overlay" [ngClass]="{'show': menuVisible}">
    <nav>
      <ul [class.show]="menuVisible">
        @for (route of routes; track route) {
          <li><a appNavButtonHover class="shadow" [routerLink]="route.path" [ngClass]="{'active': isActive('/'+route.path)}">{{route.display | sentenceCase }}</a></li>
        }
      </ul>
    </nav>
  </div>
</div>
